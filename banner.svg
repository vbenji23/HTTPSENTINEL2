<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'JetBrains Mono','Courier New',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Title block -->
  <text x="70" y="110" font-size="58" font-weight="700" fill="#e6edf3">🛡️ httpsentinel</text>
  <rect x="72" y="128" width="300" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="72" y="178" font-size="26" fill="#8b949e">Scanner de sécurité web en ligne de commande</text>

  <!-- Terminal window -->
  <rect x="70" y="220" width="1060" height="350" rx="12" fill="#010409" stroke="#30363d" stroke-width="1.5"/>
  <rect x="70" y="220" width="1060" height="38" rx="12" fill="#161b22"/>
  <rect x="70" y="244" width="1060" height="14" fill="#161b22"/>
  <circle cx="96" cy="239" r="7" fill="#ff5f56"/>
  <circle cx="120" cy="239" r="7" fill="#ffbd2e"/>
  <circle cx="144" cy="239" r="7" fill="#27c93f"/>
  <text x="600" y="244" font-size="16" fill="#6e7681" text-anchor="middle">bash — httpsentinel</text>

  <!-- Terminal content -->
  <text font-size="20" xml:space="preserve">
    <tspan x="96" y="298" fill="#2dd4bf">$ </tspan><tspan fill="#e6edf3">python -m httpsentinel https://baie42.fr --html rapport.html</tspan>
    <tspan x="96" y="338" fill="#ff5f56">[ HIGH ]</tspan><tspan fill="#c9d1d9"> Exposé : /.env</tspan>
    <tspan x="96" y="368" fill="#ff5f56">[ HIGH ]</tspan><tspan fill="#c9d1d9"> Exposé : /.git/HEAD</tspan>
    <tspan x="96" y="398" fill="#ffbd2e">[MEDIUM]</tspan><tspan fill="#c9d1d9"> Content-Security-Policy absent</tspan>
    <tspan x="96" y="428" fill="#58a6ff">[ LOW  ]</tspan><tspan fill="#c9d1d9"> X-Frame-Options absent</tspan>
    <tspan x="96" y="458" fill="#27c93f">[  OK  ]</tspan><tspan fill="#c9d1d9"> Version TLS : TLSv1.3</tspan>
    <tspan x="96" y="488" fill="#27c93f">[  OK  ]</tspan><tspan fill="#c9d1d9"> Strict-Transport-Security présent</tspan>
    <tspan x="96" y="528" fill="#8b949e">Bilan : 2 HIGH · 1 MEDIUM · 1 LOW · 0 INFO · 2 OK</tspan>
  </text>

  <!-- Footer tags -->
  <text x="70" y="608" font-size="20" fill="#6e7681">Python · Headers · TLS · Fingerprinting · Fichiers exposés · JSON / HTML</text>
</svg>
